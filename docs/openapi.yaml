      parameters:
        - in: query
          name: courseId
          required: false
          schema: { type: string }
        - in: query
          name: status
          required: false
          schema: { $ref: '#/components/schemas/StudentProfileStatus' }
      responses:
        '200':
          description: Lista de perfis de estudante
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/StudentProfileDto' }
                  meta: { $ref: '#/components/schemas/Meta' }
        '401':
          description: Não autenticado
        '403':
          description: Sem permissão
    post:
      tags: [Students]
      summary: Criar conta de estudante e perfil
      description: >-
        Roles ADMIN, COORDINATOR. Cria a conta (User) e o perfil de estudante
        numa transacção atómica, com a role STUDENT resolvida por `Role.code`.
        O curso tem de existir. Se alguma parte falhar nada é gravado.
        Audita `USER_CREATE` e `STUDENT_PROFILE_CREATED` com o mesmo
        `correlationId`. O login continua em `POST /auth/login`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateStudentProfileRequest' }
      responses:
        '201':
          description: Conta e perfil de estudante criados
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/StudentProfileDto' }
                  meta: { $ref: '#/components/schemas/Meta' }
        '400':
          description: Dados inválidos (VALIDATION_ERROR)
        '403':
          description: Sem permissão
        '404':
          description: Curso não encontrado (COURSE_NOT_FOUND)
        '409':
          description: >-
            Email já registado (USER_EXISTS), número já usado
            (STUDENT_NUMBER_EXISTS), role STUDENT em falta na BD
            (ROLE_NOT_FOUND) ou violação de unicidade concorrente
            (STUDENT_DUPLICATE)
