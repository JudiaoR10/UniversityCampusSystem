openapi: 3.0.3
info:
  title: Smart Campus Core API
  version: 1.0.0
  description: |
    API REST versionada do **Smart Campus Core** (UJAC / PTP III).

    ## Como autenticar no Swagger
    1. Execute `POST /auth/login` com um utilizador demo.
    2. Copie `data.tokens.accessToken`.
    3. Clique em **Authorize** e cole o token (ou `Bearer <token>`).
    4. Teste os endpoints protegidos.

    ## Credenciais demo
    - ADMIN: `admin@smartcampus.demo` / `Admin123!`
    - COORDINATOR: `coordenador@smartcampus.demo` / `Coord123!`
    - TEACHER: `docente@smartcampus.demo` / `Docente123!`
    - TECHNICIAN: `tecnico@smartcampus.demo` / `Tecnico123!`
    - STUDENT: `estudante@smartcampus.demo` / `Estudante123!`

    Manual completo: `docs/manual-apis-core.md`
  contact:
    name: Smart Campus Core / PTP III
servers:
  - url: http://localhost:4100/api/v1
    description: Desenvolvimento local
tags:
  - name: Health
    description: Saúde do serviço (ver também GET /health fora de /api/v1)
  - name: Auth
    description: Login, refresh e logout
  - name: Users
    description: Perfil e gestão de utilizadores
  - name: Rooms
    description: Edifícios e salas
  - name: Buildings
    description: Cadastro de edifícios (Grupo Infraestrutura)
  - name: Laboratories
    description: Laboratórios (Grupo Infraestrutura)
  - name: Equipment
    description: Inventário de equipamentos (Grupo Infraestrutura)
  - name: Incidents
    description: Ocorrências e estados
  - name: Dashboard
    description: Indicadores agregados
  - name: Audit
    description: Eventos de auditoria
  - name: IoT
    description: Dispositivos, sensores e alertas
  - name: Parking
    description: Parque, vagas e LPR
  - name: Academic
    description: Departamentos, cursos e disciplinas (Gestão Académica)
  - name: Students
    description: Perfis de estudantes (Gestão Académica)
  - name: Teachers
    description: Perfis de docentes (Gestão Académica)
  - name: Enrolments
    description: Inscrições de estudantes em disciplinas (Gestão Académica)
security:
  - bearerAuth: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ApiError:
      type: object
      required: [code, message, details, correlationId]
      properties:
        code: { type: string, example: VALIDATION_ERROR }
        message: { type: string, example: Dados inválidos }
        details:
          type: array
          items: {}
        correlationId: { type: string }
    Meta:
      type: object
      properties:
        correlationId: { type: string }
        page: { type: integer }
        pageSize: { type: integer }
        total: { type: integer }
    AuthUser:
      type: object
      properties:
        id: { type: string }
        email: { type: string, format: email }
        fullName: { type: string }
        role:
          type: string
          enum: [STUDENT, TEACHER, TECHNICIAN, COORDINATOR, ADMIN]
        isActive: { type: boolean }
    AuthTokens:
      type: object
      properties:
        accessToken: { type: string }
        refreshToken: { type: string }
        expiresIn: { type: string, example: 15m }
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email, example: admin@smartcampus.demo }
        password: { type: string, format: password, example: Admin123!, minLength: 8 }
    RefreshRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken: { type: string }
    LogoutRequest:
      type: object
      properties:
        refreshToken: { type: string }
    CreateUserRequest:
      type: object
      required: [email, password, fullName, role]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 8, maxLength: 128 }
        fullName: { type: string, minLength: 2, maxLength: 120 }
        role:
          type: string
          enum: [STUDENT, TEACHER, TECHNICIAN, COORDINATOR, ADMIN]
    CreateRoomRequest:
      type: object
      required: [code, name, capacity, buildingId]
      properties:
        code: { type: string, example: A-101 }
        name: { type: string, example: Sala de Aula 101 }
        capacity: { type: integer, minimum: 1, maximum: 1000, example: 40 }
        floor: { type: integer, minimum: -5, maximum: 100, default: 0 }
        status:
          type: string
          enum: [AVAILABLE, OCCUPIED, MAINTENANCE, RESERVED]
        buildingId: { type: string }
    CreateDeviceRequest:
      type: object
      required: [code, name, type]
      properties:
        code: { type: string, minLength: 2, maxLength: 32, example: TEMP-A-01 }
        name: { type: string, minLength: 2, maxLength: 120, example: Sensor de temperatura A }
        type: { type: string, minLength: 2, maxLength: 60, example: sensor }
        status:
          type: string
          enum: [ONLINE, OFFLINE, MAINTENANCE, UNKNOWN]
          description: Opcional. Por omissão UNKNOWN.
        roomId: { type: string, nullable: true }
        mqttTopic: { type: string, maxLength: 200, nullable: true }
    RoomDto:
      type: object
      properties:
        id: { type: string }
        code: { type: string }
        name: { type: string }
        capacity: { type: integer }
        floor: { type: integer }
        status: { type: string }
        building:
          type: object
          properties:
            id: { type: string }
            code: { type: string }
            name: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    CreateBuildingRequest:
      type: object
      required: [code, name]
      properties:
        code: { type: string, example: B-01 }
        name: { type: string, example: Edifício Central }
        description: { type: string, nullable: true }
        floors: { type: integer, minimum: 0, maximum: 200, default: 1 }
    BuildingDto:
      type: object
      properties:
        id: { type: string }
        code: { type: string }
        name: { type: string }
        description: { type: string, nullable: true }
        floors: { type: integer }
        roomsCount: { type: integer }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    CreateLaboratoryRequest:
      type: object
      required: [code, name, buildingId]
      properties:
        code: { type: string, example: L-01 }
        name: { type: string, example: Laboratório de Redes }
        description: { type: string, nullable: true }
        buildingId: { type: string }
    LaboratoryDto:
      type: object
      properties:
        id: { type: string }
        code: { type: string }
        name: { type: string }
        description: { type: string, nullable: true }
        buildingId: { type: string }
        building:
          type: object
          properties:
            id: { type: string }
            code: { type: string }
            name: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    CreateEquipmentRequest:
      type: object
      required: [code, name]
      properties:
        code: { type: string, example: EQ-01 }
        name: { type: string, example: Projetor Epson }
        description: { type: string, nullable: true }
        roomId: { type: string, nullable: true }
        laboratoryId: { type: string, nullable: true }
    EquipmentDto:
      type: object
      properties:
        id: { type: string }
        code: { type: string }
        name: { type: string }
        description: { type: string, nullable: true }
        roomId: { type: string, nullable: true }
        laboratoryId: { type: string, nullable: true }
        room:
          type: object
          nullable: true
          properties:
            id: { type: string }
            code: { type: string }
            name: { type: string }
        laboratory:
          type: object
          nullable: true
          properties:
            id: { type: string }
            code: { type: string }
            name: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    CreateIncidentRequest:
      type: object
      required: [title, description]
      properties:
        title: { type: string, minLength: 3, maxLength: 160, example: Projector sem imagem }
        description: { type: string, minLength: 5, maxLength: 2000 }
        priority:
          type: string
          enum: [LOW, MEDIUM, HIGH, CRITICAL]
          default: MEDIUM
        roomId: { type: string, nullable: true }
        equipmentId: { type: string, nullable: true }
    UpdateIncidentStatusRequest:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [OPEN, IN_PROGRESS, RESOLVED, CLOSED]
        notes: { type: string, maxLength: 1000 }
        assigneeId: { type: string, nullable: true }
    IncidentDto:
      type: object
      properties:
        id: { type: string }
        title: { type: string }
        description: { type: string }
        status: { type: string }
        priority: { type: string }
        roomId: { type: string, nullable: true }
        reporterId: { type: string }
        assigneeId: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    CreatePlateReadingRequest:
      type: object
      required: [lotId, plate, direction]
      properties:
        lotId: { type: string }
        plate:
          type: string
          description: Matrícula MZ — AXX 123 MP|MC (começa por A) ou legado AAA 12 34
          example: AIT 954 MC
        direction:
          type: string
          enum: [IN, OUT]
        sensorCode: { type: string, default: CAM-LPR-SIM }
        confidence: { type: number, minimum: 0, maximum: 1, default: 0.9 }
        photoUrl: { type: string, format: uri, nullable: true }
        spotCode: { type: string, nullable: true }
    UpdateParkingSpotRequest:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [FREE, OCCUPIED, RESERVED, OUT_OF_SERVICE]
        plate: { type: string, nullable: true }
    CreateDepartmentRequest:
      type: object
      required: [code, name]
      properties:
        code: { type: string, minLength: 2, maxLength: 20, example: DEI }
        name: { type: string, minLength: 3, maxLength: 120, example: Departamento de Engenharia Informática }
        description: { type: string, maxLength: 500 }
    DepartmentDto:
      type: object
      properties:
        id: { type: string }
        code: { type: string }
        name: { type: string }
        description: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    CreateCourseRequest:
      type: object
      required: [code, name, departmentId]
      properties:
        code: { type: string, minLength: 2, maxLength: 10, example: LEI }
        name: { type: string, minLength: 3, maxLength: 120, example: Licenciatura em Engenharia Informática }
        description: { type: string, maxLength: 500 }
        departmentId: { type: string, description: 'Obtém-se de GET /departments' }
    CourseDto:
      type: object
      properties:
        id: { type: string }
        code: { type: string }
        name: { type: string }
        description: { type: string, nullable: true }
        departmentId: { type: string }
        department:
          type: object
          properties:
            id: { type: string }
            code: { type: string }
            name: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    CreateSubjectRequest:
      type: object
      required: [code, name, credits, courseId]
      properties:
        code: { type: string, minLength: 2, maxLength: 10, example: PTP3 }
        name: { type: string, minLength: 3, maxLength: 120, example: Projecto de Tecnologias de Programação III }
        credits: { type: integer, minimum: 1, example: 6 }
        courseId: { type: string, description: 'Obtém-se de GET /courses' }
    SubjectDto:
      type: object
      properties:
        id: { type: string }
        code: { type: string }
        name: { type: string }
        credits: { type: integer }
        courseId: { type: string }
        course:
          type: object
          properties:
            id: { type: string }
            code: { type: string }
            name: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    BatchCreateCourseWithSubjectsRequest:
      type: object
      required: [course, subjects]
      properties:
        course: { $ref: '#/components/schemas/CreateCourseRequest' }
        subjects:
          type: array
          minItems: 1
          items:
            type: object
            required: [code, name, credits]
            properties:
              code: { type: string, minLength: 2, maxLength: 10 }
              name: { type: string, minLength: 3, maxLength: 120 }
              credits: { type: integer, minimum: 1 }
    BatchCreateCourseWithSubjectsResult:
      type: object
      properties:
        course: { $ref: '#/components/schemas/CourseDto' }
        subjects:
          type: array
          items: { $ref: '#/components/schemas/SubjectDto' }
    EntityRef:
      type: object
      properties:
        id: { type: string }
        code: { type: string }
        name: { type: string }
    StudentProfileStatus:
      type: string
      enum: [ACTIVE, SUSPENDED, GRADUATED, WITHDRAWN]
    CreateStudentProfileRequest:
      type: object
      description: >-
        Conta (User) e perfil criados na mesma transacção atómica. Não envie
        `userId` nem `role`: a role STUDENT é resolvida pelo servidor.
      required: [email, password, fullName, studentNumber, courseId]
      properties:
        email: { type: string, format: email, example: aluno@ujac.ac.mz }
        password: { type: string, format: password, minLength: 8, maxLength: 128 }
        fullName: { type: string, minLength: 2, maxLength: 120, example: 'Ana Maria Silva' }
        studentNumber: { type: string, minLength: 2, maxLength: 30, example: '20240123' }
        courseId: { type: string, description: 'Obtém-se de GET /courses' }
        yearOfStudy: { type: integer, minimum: 1, maximum: 10, nullable: true, example: 2 }
        phone: { type: string, minLength: 6, maxLength: 30, example: '+258840000000' }
    UpdateStudentProfileRequest:
      type: object
      description: Envie pelo menos um campo.
      properties:
        courseId: { type: string }
        yearOfStudy: { type: integer, minimum: 1, maximum: 10, nullable: true }
        phone: { type: string, minLength: 6, maxLength: 30, nullable: true }
        status: { $ref: '#/components/schemas/StudentProfileStatus' }
    UpdateContactRequest:
      type: object
      required: [phone]
      properties:
        phone: { type: string, minLength: 6, maxLength: 30, example: '+258840000000' }
    StudentProfileDto:
      type: object
      properties:
        id: { type: string }
        userId: { type: string }
        studentNumber: { type: string, example: '20240123' }
        courseId: { type: string, nullable: true }
        course: { allOf: [{ $ref: '#/components/schemas/EntityRef' }], nullable: true }
        yearOfStudy: { type: integer, nullable: true }
        phone: { type: string, nullable: true }
        status: { $ref: '#/components/schemas/StudentProfileStatus' }
        user:
          type: object
          properties:
            id: { type: string }
            fullName: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    TeacherProfileStatus:
      type: string
      enum: [ACTIVE, ON_LEAVE, INACTIVE]
    CreateTeacherProfileRequest:
      type: object
      description: >-
        Conta (User) e perfil criados na mesma transacção atómica. Não envie
        `userId` nem `role`: a role TEACHER é resolvida pelo servidor.
      required: [email, password, fullName, employeeCode, departmentId]
      properties:
        email: { type: string, format: email, example: docente@ujac.ac.mz }
        password: { type: string, format: password, minLength: 8, maxLength: 128 }
        fullName: { type: string, minLength: 2, maxLength: 120, example: 'João Paulo Macuácua' }
        employeeCode: { type: string, minLength: 2, maxLength: 30, example: 'DOC-0042' }
        departmentId: { type: string, description: 'Obtém-se de GET /departments' }
        title: { type: string, minLength: 2, maxLength: 80, example: Professor Auxiliar }
        phone: { type: string, minLength: 6, maxLength: 30, example: '+258840000000' }
    UpdateTeacherProfileRequest:
      type: object
      description: Envie pelo menos um campo.
      properties:
        departmentId: { type: string }
        title: { type: string, minLength: 2, maxLength: 80 }
        phone: { type: string, minLength: 6, maxLength: 30, nullable: true }
        status: { $ref: '#/components/schemas/TeacherProfileStatus' }
    TeacherProfileDto:
      type: object
      properties:
        id: { type: string }
        userId: { type: string }
        employeeCode: { type: string, example: 'DOC-0042' }
        departmentId: { type: string, nullable: true }
        department: { allOf: [{ $ref: '#/components/schemas/EntityRef' }], nullable: true }
        title: { type: string, nullable: true }
        phone: { type: string, nullable: true }
        status: { $ref: '#/components/schemas/TeacherProfileStatus' }
        user:
          type: object
          properties:
            id: { type: string }
            fullName: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    EnrolmentStatus:
      type: string
      enum: [PENDING, ACTIVE, CANCELLED, COMPLETED]
    CreateEnrolmentRequest:
      type: object
      required: [studentId, subjectId, academicYear]
      properties:
        studentId: { type: string, description: 'ID do perfil de estudante (GET /students)' }
        subjectId: { type: string, description: 'Obtém-se de GET /subjects' }
        academicYear: { type: integer, minimum: 2000, maximum: 2100, example: 2026 }
    UpdateEnrolmentStatusRequest:
      type: object
      required: [status]
      properties:
        status: { $ref: '#/components/schemas/EnrolmentStatus' }
    SubjectEnrolmentDto:
      type: object
      properties:
        id: { type: string }
        studentId: { type: string }
        student:
          type: object
          properties:
            id: { type: string }
            studentNumber: { type: string }
            fullName: { type: string }
        subjectId: { type: string }
        subject: { $ref: '#/components/schemas/EntityRef' }
        academicYear: { type: integer, example: 2026 }
        status: { $ref: '#/components/schemas/EnrolmentStatus' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    DeletedResult:
      type: object
      properties:
        id: { type: string }
        deleted: { type: boolean, example: true }
paths:
  /auth/login:
    post:
      tags: [Auth]
      security: []
      summary: Autenticar utilizador
      description: Devolve access JWT + refresh token. Não requer Authorization.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Login bem-sucedido
        '401':
          description: Credenciais inválidas
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
  /auth/refresh:
    post:
      tags: [Auth]
      security: []
      summary: Renovar tokens
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshRequest' }
      responses:
        '200':
          description: Tokens renovados
        '401':
          description: Refresh inválido ou expirado
  /auth/logout:
    post:
      tags: [Auth]
      summary: Terminar sessão
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LogoutRequest' }
      responses:
        '200':
          description: Sessão terminada
  /me:
    get:
      tags: [Users]
      summary: Perfil do utilizador autenticado
      responses:
        '200':
          description: Perfil AuthUser
        '401':
          description: Não autenticado
  /users:
    get:
      tags: [Users]
      summary: Listar utilizadores
      description: Roles ADMIN e COORDINATOR.
      responses:
        '200':
          description: Lista de utilizadores
        '403':
          description: Sem permissão
    post:
      tags: [Users]
      summary: Criar utilizador
      description: Apenas ADMIN.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateUserRequest' }
      responses:
        '201':
          description: Utilizador criado
        '403':
          description: Sem permissão
        '409':
          description: Email já existe
  /rooms:
    get:
      tags: [Rooms]
      summary: Listar salas
      responses:
        '200':
          description: Lista de salas
    post:
      tags: [Rooms]
      summary: Criar sala
      description: Roles ADMIN, COORDINATOR, TECHNICIAN.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateRoomRequest' }
      responses:
        '201':
          description: Sala criada
  /rooms/{id}:
    get:
      tags: [Rooms]
      summary: Obter sala
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Sala
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/RoomDto' }
                  meta: { $ref: '#/components/schemas/Meta' }
        '404':
          description: Não encontrada
    patch:
      tags: [Rooms]
      summary: Actualizar sala
      description: Roles ADMIN, COORDINATOR, TECHNICIAN.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateRoomRequest' }
      responses:
        '200':
          description: Sala actualizada
        '403':
          description: Sem permissão
        '404':
          description: Sala não encontrada
        '409':
          description: Código de sala já existente
    delete:
      tags: [Rooms]
      summary: Remover sala
      description: Roles ADMIN, COORDINATOR, TECHNICIAN.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Sala removida
        '403':
          description: Sem permissão
        '404':
          description: Sala não encontrada
  /buildings:
    get:
      tags: [Buildings]
      summary: Listar edifícios
      responses:
        '200':
          description: Lista de edifícios
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/BuildingDto' }
                  meta: { $ref: '#/components/schemas/Meta' }
    post:
      tags: [Buildings]
      summary: Criar edifício
      description: Roles TECHNICIAN, COORDINATOR, ADMIN.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateBuildingRequest' }
      responses:
        '201':
          description: Criado
        '400':
          description: Payload inválido
        '403':
          description: Sem permissão
  /buildings/{id}:
    get:
      tags: [Buildings]
      summary: Obter edifício
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Edifício
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/BuildingDto' }
                  meta: { $ref: '#/components/schemas/Meta' }
        '404':
          description: Não encontrado
    patch:
      tags: [Buildings]
      summary: Actualizar edifício
      description: Roles TECHNICIAN, COORDINATOR, ADMIN.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateBuildingRequest' }
      responses:
        '200':
          description: Actualizado
        '403':
