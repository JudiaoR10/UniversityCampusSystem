  /financial/teachers:
    get:
      summary: Pesquisar docentes existentes (FINANCE/ADMIN)
      tags:
        - Financial
      security:
        - bearerAuth: []
      description: Leitura mínima do cadastro do Core. Não cria nem edita perfis académicos. Pesquisa por
        nome ou código docente; inclui contas inactivas.
      parameters:
        - name: q
          in: query
          schema:
            type: string
            minLength: 2
            maxLength: 100
        - &a10
          name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            maximum: 100000
            default: 0
        - &a11
          name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: Página autorizada; total filtrado e hasMore.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/TeacherIdentitySummary"
                  meta:
                    $ref: "#/components/schemas/FinancialPageMeta"
        "400": &a12
          description: Entrada inválida
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401": &a13
          description: Não autenticado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403": &a14
          description: Perfil sem permissão; ADMIN não pode escrever salários
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404": &a15
          description: Docente ou salário inexistente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409": &a16
          description: Salário mensal duplicado, já pago, alterado ou referência de pagamento repetida
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "422": &a17
          description: Relatório excede 10 000 movimentos; não é devolvido um relatório truncado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500": &a18
          description: Erro interno
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /financial/employees:
    get:
      summary: Listar funcionários do Core e do cadastro externo (FINANCE/ADMIN)
      tags: [Financial]
      security: [{ bearerAuth: [] }]
      description: Reutiliza utilizadores docentes, técnicos, coordenadores, administrativos e financeiros do Core e acrescenta pessoal externo sem conta, como guardas e agentes de limpeza.
      parameters:
        - { name: q, in: query, schema: { type: string, minLength: 2, maxLength: 100 } }
        - { name: category, in: query, schema: { type: string, enum: [TEACHER, TECHNICIAN, COORDINATOR, ADMINISTRATIVE, FINANCE, CLEANER, GUARD, OTHER] } }
        - { name: active, in: query, schema: { type: boolean } }
        - *a10
        - *a11
      responses:
        "200":
          description: Página de funcionários.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/Employee" } }
                  meta: { $ref: "#/components/schemas/FinancialPageMeta" }
        "400": *a12
        "401": *a13
        "403": *a14
  /financial/employees/external:
    post:
      summary: Cadastrar funcionário externo sem criar utilizador (apenas FINANCE)
      tags: [Financial]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [employeeCode, fullName, category, jobTitle]
              properties:
                employeeCode: { type: string }
                fullName: { type: string }
                category: { type: string, enum: [CLEANER, GUARD, ADMINISTRATIVE, OTHER] }
                jobTitle: { type: string }
      responses:
        "201": { description: Funcionário externo criado. }
        "400": *a12
        "401": *a13
        "403": *a14
        "409": *a16
