      tags: [Students]
      summary: Actualizar perfil de estudante
      description: Roles ADMIN, COORDINATOR. Envie pelo menos um campo.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateStudentProfileRequest' }
      responses:
        '200':
          description: Perfil actualizado
        '400':
          description: Dados inválidos (VALIDATION_ERROR)
        '403':
          description: Sem permissão
        '404':
          description: Estudante (STUDENT_NOT_FOUND) ou curso (COURSE_NOT_FOUND) não encontrado
    delete:
      tags: [Students]
      summary: Eliminar estudante e conta de acesso
      description: >-
        Roles ADMIN, COORDINATOR. Remove o perfil **e** a conta (User) na mesma
        transacção, pelo que o email fica livre e o login deixa de funcionar.
        Audita `STUDENT_PROFILE_DELETED` e `USER_DELETE`. Rejeita com
        `409 STUDENT_HAS_ENROLMENTS` se o estudante tiver inscrições e com
        `409 USER_HAS_DEPENDENCIES` se a conta tiver ocorrências ou acções de
        manutenção associadas.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Estudante e conta eliminados
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/DeletedResult' }
                  meta: { $ref: '#/components/schemas/Meta' }
        '403':
          description: Sem permissão
        '404':
          description: Não encontrado (STUDENT_NOT_FOUND)
        '409':
          description: >-
            Estudante com inscrições (STUDENT_HAS_ENROLMENTS) ou conta com
            registos do Core (USER_HAS_DEPENDENCIES)
  /teachers:
    get:
      tags: [Teachers]
      summary: Listar docentes
      description: Qualquer utilizador autenticado. Filtros opcionais.
      parameters:
        - in: query
          name: departmentId
          required: false
          schema: { type: string }
        - in: query
          name: status
          required: false
          schema: { $ref: '#/components/schemas/TeacherProfileStatus' }
      responses:
        '200':
          description: Lista de perfis de docente
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/TeacherProfileDto' }
                  meta: { $ref: '#/components/schemas/Meta' }
        '401':
          description: Não autenticado
    post:
      tags: [Teachers]
      summary: Criar conta de docente e perfil
      description: >-
        Role ADMIN. Cria a conta (User) e o perfil de docente numa transacção
        atómica, com a role TEACHER resolvida por `Role.code`. O departamento
        tem de existir. Se alguma parte falhar nada é gravado. Audita
        `USER_CREATE` e `TEACHER_PROFILE_CREATED` com o mesmo `correlationId`.
        O login continua em `POST /auth/login`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateTeacherProfileRequest' }
      responses:
        '201':
          description: Conta e perfil de docente criados
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/TeacherProfileDto' }
                  meta: { $ref: '#/components/schemas/Meta' }
        '400':
          description: Dados inválidos (VALIDATION_ERROR)
        '403':
          description: Sem permissão
        '404':
          description: Departamento não encontrado (DEPARTMENT_NOT_FOUND)
        '409':
          description: >-
            Email já registado (USER_EXISTS), código já usado
            (TEACHER_EMPLOYEE_CODE_EXISTS), role TEACHER em falta na BD
            (ROLE_NOT_FOUND) ou violação de unicidade concorrente
            (TEACHER_DUPLICATE)
  /teachers/me:
    get:
      tags: [Teachers]
      summary: Perfil de docente do utilizador autenticado
      responses:
        '200':
          description: Perfil de docente
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/TeacherProfileDto' }
                  meta: { $ref: '#/components/schemas/Meta' }
        '401':
          description: Não autenticado
        '404':
          description: Sem perfil de docente (TEACHER_NOT_FOUND)
    patch:
      tags: [Teachers]
      summary: Actualizar contacto do próprio docente
      description: Role TEACHER. Apenas o telefone é actualizável pelo próprio.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateContactRequest' }
      responses:
        '200':
          description: Perfil actualizado
        '400':
          description: Dados inválidos (VALIDATION_ERROR)
        '403':
          description: Sem permissão
        '404':
          description: Sem perfil de docente (TEACHER_NOT_FOUND)
  /teachers/by-user/{userId}:
    get:
      tags: [Teachers]
      summary: Obter perfil de docente pelo utilizador
      description: Roles ADMIN, COORDINATOR, TEACHER.
      parameters:
        - in: path
          name: userId
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Perfil de docente
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/TeacherProfileDto' }
                  meta: { $ref: '#/components/schemas/Meta' }
        '403':
          description: Sem permissão
        '404':
          description: Sem perfil de docente (TEACHER_NOT_FOUND)
  /teachers/{id}:
    get:
      tags: [Teachers]
      summary: Obter perfil de docente
      description: Roles ADMIN, COORDINATOR, TEACHER.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Perfil de docente
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/TeacherProfileDto' }
                  meta: { $ref: '#/components/schemas/Meta' }
        '403':
          description: Sem permissão
        '404':
          description: Não encontrado (TEACHER_NOT_FOUND)
    patch:
      tags: [Teachers]
      summary: Actualizar perfil de docente
      description: Roles ADMIN, COORDINATOR. Envie pelo menos um campo.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateTeacherProfileRequest' }
      responses:
        '200':
          description: Perfil actualizado
        '400':
          description: Dados inválidos (VALIDATION_ERROR)
        '403':
          description: Sem permissão
        '404':
          description: >-
            Docente (TEACHER_NOT_FOUND) ou departamento (DEPARTMENT_NOT_FOUND)
            não encontrado
    delete:
      tags: [Teachers]
      summary: Eliminar docente e conta de acesso
      description: >-
        Role ADMIN. Remove o perfil **e** a conta (User) na mesma transacção,
        pelo que o email fica livre e o login deixa de funcionar. Audita
        `TEACHER_PROFILE_DELETED` e `USER_DELETE`. Rejeita com
        `409 USER_HAS_DEPENDENCIES` se a conta tiver ocorrências ou acções de
        manutenção associadas.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Docente e conta eliminados
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/DeletedResult' }
                  meta: { $ref: '#/components/schemas/Meta' }
        '403':
          description: Sem permissão
        '404':
          description: Não encontrado (TEACHER_NOT_FOUND)
        '409':
          description: Conta com registos do Core (USER_HAS_DEPENDENCIES)
  /enrolments:
    get:
      tags: [Enrolments]
      summary: Listar inscrições
      description: >-
        Roles ADMIN, COORDINATOR, TEACHER, STUDENT. Um STUDENT vê apenas as
        suas próprias inscrições; os restantes podem filtrar por estudante.
      parameters:
        - in: query
          name: studentId
          required: false
          schema: { type: string }
        - in: query
          name: subjectId
          required: false
          schema: { type: string }
        - in: query
          name: academicYear
          required: false
          schema: { type: integer, minimum: 2000, maximum: 2100 }
      responses:
        '200':
          description: Lista de inscrições
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/SubjectEnrolmentDto' }
                  meta: { $ref: '#/components/schemas/Meta' }
        '401':
          description: Não autenticado
        '403':
          description: Sem permissão
    post:
      tags: [Enrolments]
      summary: Criar inscrição
      description: >-
        ADMIN, COORDINATOR ou o próprio STUDENT. O estudante tem de estar
        ACTIVE, ter curso e a disciplina tem de pertencer a esse curso.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateEnrolmentRequest' }
      responses:
        '201':
          description: Inscrição criada
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/SubjectEnrolmentDto' }
                  meta: { $ref: '#/components/schemas/Meta' }
        '400':
          description: Dados inválidos (VALIDATION_ERROR)
        '403':
          description: Sem permissão (FORBIDDEN)
        '404':
          description: Estudante (STUDENT_NOT_FOUND) ou disciplina (SUBJECT_NOT_FOUND) não encontrado
        '409':
          description: >-
            Estudante inactivo (STUDENT_NOT_ACTIVE), sem curso
            (STUDENT_WITHOUT_COURSE), disciplina de outro curso
            (SUBJECT_NOT_IN_STUDENT_COURSE) ou inscrição duplicada
            (DUPLICATE_ENROLMENT)
  /enrolments/{id}/status:
    patch:
      tags: [Enrolments]
      summary: Alterar estado da inscrição
      description: >-
        Roles ADMIN, COORDINATOR. Transições permitidas: PENDING → ACTIVE |
        CANCELLED; ACTIVE → COMPLETED | CANCELLED; COMPLETED e CANCELLED são
        estados finais. A conclusão (COMPLETED) está reservada à coordenação:
        ADMIN pode activar e cancelar, mas recebe 403 ao tentar concluir.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateEnrolmentStatusRequest' }
      responses:
        '200':
          description: Estado actualizado
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/SubjectEnrolmentDto' }
                  meta: { $ref: '#/components/schemas/Meta' }
        '400':
          description: Dados inválidos (VALIDATION_ERROR)
        '403':
          description: >-
            Sem permissão, ou ADMIN a tentar concluir uma inscrição (FORBIDDEN)
        '404':
          description: Não encontrada (ENROLMENT_NOT_FOUND)
        '409':
          description: Transição inválida (INVALID_STATUS_TRANSITION)
  /enrolments/{id}:
    delete:
      tags: [Enrolments]
      summary: Eliminar inscrição
      description: Roles ADMIN, COORDINATOR.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Inscrição eliminada
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/DeletedResult' }
                  meta: { $ref: '#/components/schemas/Meta' }
        '403':
          description: Sem permissão
        '404':
          description: Não encontrada (ENROLMENT_NOT_FOUND)
