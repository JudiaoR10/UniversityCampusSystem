    post:
      tags:
        - IoT
      summary: Criar dispositivo
      description: Roles ADMIN, COORDINATOR, TECHNICIAN. Regista o evento de auditoria DEVICE_CREATE.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDeviceRequest"
      responses:
        "201":
          description: Dispositivo criado
        "400":
          description: Dados inválidos (VALIDATION_ERROR)
        "403":
          description: Sem permissão para este role
        "404":
          description: Sala não encontrada (ROOM_NOT_FOUND)
        "409":
          description: Já existe um dispositivo com este código (DEVICE_CODE_TAKEN)
  /devices/{id}/status:
    patch:
      tags:
        - IoT
      summary: Alterar o estado de um dispositivo
      description: Roles ADMIN, COORDINATOR, TECHNICIAN. Idempotente. Uma passagem para OFFLINE, ou de
        OFFLINE para ONLINE, gera alerta e notificações. Regista o evento DEVICE_STATUS_UPDATE.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - status
              properties:
                status:
                  type: string
                  enum:
                    - ONLINE
                    - OFFLINE
                    - MAINTENANCE
                    - UNKNOWN
      responses:
        "200":
          description: Dispositivo com o novo estado
        "400":
          description: Estado inválido (VALIDATION_ERROR)
        "403":
          description: Sem permissão para este role
        "404":
          description: Dispositivo não encontrado (DEVICE_NOT_FOUND)
  /devices/{id}:
    delete:
      tags:
        - IoT
      summary: Eliminar dispositivo
      description: Roles ADMIN, COORDINATOR. Não elimina dispositivos ONLINE. Regista o evento DEVICE_DELETE.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Dispositivo eliminado (devolve o id)
        "403":
          description: Sem permissão para este role
        "404":
          description: Dispositivo não encontrado (DEVICE_NOT_FOUND)
