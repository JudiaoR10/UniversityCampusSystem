    get:
      summary: "Consultar Dívida Específica [RBAC: FINANCE/ADMIN ou STUDENT proprietario]"
      tags:
        - Financial
      security:
        - bearerAuth: []
      description: "FINANCE e ADMIN consultam qualquer dívida. STUDENT consulta apenas a sua: outro
        proprietário devolve 403 FORBIDDEN. Não recebe corpo nem parâmetros de query. Um
        identificador desconhecido devolve 404."
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Identificador interno da dívida devolvido por POST /api/v1/financial/debts ou pela
            listagem; não usar o código DBT.
      responses:
        "200":
          description: Dívida encontrada e acesso autorizado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiSuccessDebt"
              example:
                data:
                  id: debt_semana6
                  code: DBT-2026-006
                  studentId: usr_student_01
                  title: Propina de Outubro
                  description: Mensalidade de Engenharia Informática
                  amount: 3500
                  origin: TUITION_2026
                  dueDate: 2099-10-31T23:59:59.000Z
                  status: PENDENTE
                  createdAt: 2026-09-30T10:00:00.000Z
                  updatedAt: 2026-09-30T10:00:00.000Z
                meta:
                  correlationId: semana6-200
        "401":
          description: Token de acesso ou sessao invalida.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                code: UNAUTHORIZED
                message: Token de acesso ou sessao invalida.
                correlationId: semana6-401
                details: []
        "403":
          description: Perfil sem permissão ou dívida de outro estudante.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                code: FORBIDDEN
                message: Perfil sem permissão ou dívida de outro estudante.
                correlationId: semana6-403
                details: []
        "404":
          description: Dívida não encontrada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                code: DEBT_NOT_FOUND
                message: Dívida não encontrada.
                correlationId: semana6-404
                details: []
        "429":
          description: Demasiados pedidos; consultar Retry-After
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          description: Erro interno do Core (INTERNAL_ERROR).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
